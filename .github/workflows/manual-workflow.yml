#
# Probe: test a previously built sysbox-ce deb without rebuilding it.
#
# This replaces the manual-workflow template on this probe branch only, and is
# dispatched through the "Manual Workflow" entry (see the original template).
#
# * install-check: quick check (no privileged harness) that the deb installs
#   non-interactively in a plain jammy container that already has fuse3.
# * test-deb: runs 'make test-sysbox-installer' against the deb, using the
#   test harness from the given sysbox ref.
#

name: Manual Workflow

on:
  workflow_dispatch:
    inputs:
      deb_run_id:
        description: "Run whose deb-amd64 artifact is tested (build.yml artifact)"
        required: true
        default: "42452842974"
        type: string
      deb_url:
        description: "If set, test the deb at this URL instead of the artifact (test-deb only)"
        required: false
        default: ""
        type: string
      sysbox_ref:
        description: "Ref of the sysbox repo providing the test harness"
        required: false
        default: harness-fix
        type: string
      make_target:
        description: "Make target to run in the sysbox repo (empty = skip test-deb)"
        required: false
        default: ""
        type: string
      testpath:
        description: "Optional TESTPATH passed to the make target"
        required: false
        default: ""
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  kernel-info:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: report kernel features relevant to sysbox
        run: |
          echo "runner: ${{ matrix.runner }}"
          uname -mr
          echo "--- shiftfs"
          grep -c shiftfs /proc/filesystems || true
          modinfo shiftfs 2>&1 | head -3 || true
          sudo modprobe shiftfs 2>&1 | head -2 || true
          grep -c shiftfs /proc/filesystems || true
          ls /lib/modules/$(uname -r)/kernel/fs 2>/dev/null | grep -i shift || echo "no shiftfs module file"
          echo "--- idmapped mounts / overlayfs"
          grep -E "overlay|fuse" /proc/filesystems || true
          zcat /proc/config.gz 2>/dev/null | grep -E "CONFIG_USER_NS=|CONFIG_OVERLAY_FS=" || grep -E "CONFIG_USER_NS=|CONFIG_OVERLAY_FS=" /boot/config-$(uname -r) || true

  install-check:
    runs-on: ubuntu-22.04
    steps:
      - name: download deb package
        uses: actions/download-artifact@v4
        with:
          name: deb-amd64
          path: debs
          run-id: ${{ inputs.deb_run_id }}
          github-token: ${{ github.token }}

      # Mimics the old harness: no dpkg conffile options.
      - name: install with default dpkg options (fuse3 preinstalled)
        run: |
          docker run --rm -v "${PWD}/debs:/debs:ro" ubuntu:22.04 bash -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq && apt-get install -y -qq fuse3 > /dev/null
              apt-get install -y --no-install-recommends /debs/sysbox-ce_*.deb
              echo "apt exit code: $?"
              dpkg -s fuse | grep -i "^status"
              dpkg -s sysbox-ce | grep -i "^status"
          ' || true

      - name: install with --force-confold (fuse3 preinstalled)
        run: |
          docker run --rm -v "${PWD}/debs:/debs:ro" ubuntu:22.04 bash -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq && apt-get install -y -qq fuse3 > /dev/null
              apt-get install -y --no-install-recommends \
                  -o Dpkg::Options::=--force-confold /debs/sysbox-ce_*.deb
              echo "apt exit code: $?"
              dpkg -s fuse | grep -i "^status"
              dpkg -s sysbox-ce | grep -i "^status"
          ' || true

  test-deb:
    if: inputs.make_target != ''
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: checkout sysbox
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.SYSBOX_REPO || 'nestybox/sysbox' }}
          ref: ${{ inputs.sysbox_ref }}
          submodules: recursive
          fetch-depth: 0

      - name: free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
              /usr/local/lib/android
          df -h /

      # The test container installs the package from a path relative to the
      # sysbox source tree, which is mounted into the container.
      - name: download deb package
        if: inputs.deb_url == ''
        uses: actions/download-artifact@v4
        with:
          name: deb-amd64
          path: sysbox-pkgr/deb/build/amd64/ubuntu-jammy
          run-id: ${{ inputs.deb_run_id }}
          github-token: ${{ github.token }}

      - name: download deb package from url
        if: inputs.deb_url != ''
        env:
          DEB_URL: ${{ inputs.deb_url }}
        run: |
          mkdir -p sysbox-pkgr/deb/build/amd64/ubuntu-jammy
          curl -fsSL -o "sysbox-pkgr/deb/build/amd64/ubuntu-jammy/$(basename "${DEB_URL}")" "${DEB_URL}"
          ls -l sysbox-pkgr/deb/build/amd64/ubuntu-jammy

      - name: run tests against the deb
        env:
          MAKE_TARGET: ${{ inputs.make_target }}
          TESTPATH: ${{ inputs.testpath }}
        run: make "${MAKE_TARGET}" TESTPATH="${TESTPATH}"

      - name: collect logs on failure
        if: failure()
        run: |
          docker ps -a || true
          docker logs sysbox-test 2>&1 | tail -n 1000 || true

      - name: cleanup
        if: always()
        run: |
          make test-cleanup || true
          docker system prune -a -f || true
