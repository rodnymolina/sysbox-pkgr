#
# Probe: test a previously built sysbox-ce deb without rebuilding it.
#
# This replaces the manual-workflow template on this probe branch only, and is
# dispatched through the "Manual Workflow" entry (see the original template).
#
# * install-check: quick check (no privileged harness) that the deb installs
#   non-interactively in a plain jammy container that already has fuse3.
# * test-deb: runs 'make test-sysbox-installer' against the deb, using the
#   test harness from the given sysbox ref.
#

name: Manual Workflow

on:
  workflow_dispatch:
    inputs:
      deb_run_id:
        description: "Run whose deb-amd64 artifact is tested (build.yml artifact)"
        required: true
        default: "42452842974"
        type: string
      deb_url:
        description: "If set, test the deb at this URL instead of the artifact (test-deb only)"
        required: false
        default: ""
        type: string
      sysbox_ref:
        description: "Ref of the sysbox repo providing the test harness"
        required: false
        default: harness-fix
        type: string
      make_target:
        description: "Make target to run in the sysbox repo (empty = skip test-deb)"
        required: false
        default: ""
        type: string
      testpath:
        description: "Optional TESTPATH passed to the make target"
        required: false
        default: ""
        type: string
      skip_scenarios:
        description: "Space-separated scenarios to skip (TEST_SYSBOX_SKIP_SCENARIOS)"
        required: false
        default: "rootfs_cloning"
        type: string
      skip_suites:
        description: "Space-separated suites to skip (TEST_SYSBOX_SKIP_SUITES)"
        required: false
        default: "tests/pods/pods.sh"
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  kernel-info:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: report kernel features relevant to sysbox
        run: |
          echo "runner: ${{ matrix.runner }}"
          uname -mr
          echo "--- shiftfs"
          grep -c shiftfs /proc/filesystems || true
          modinfo shiftfs 2>&1 | head -3 || true
          sudo modprobe shiftfs 2>&1 | head -2 || true
          grep -c shiftfs /proc/filesystems || true
          ls /lib/modules/$(uname -r)/kernel/fs 2>/dev/null | grep -i shift || echo "no shiftfs module file"
          echo "--- idmapped mounts / overlayfs"
          grep -E "overlay|fuse" /proc/filesystems || true
          zcat /proc/config.gz 2>/dev/null | grep -E "CONFIG_USER_NS=|CONFIG_OVERLAY_FS=" || grep -E "CONFIG_USER_NS=|CONFIG_OVERLAY_FS=" /boot/config-$(uname -r) || true

  install-check:
    runs-on: ubuntu-22.04
    steps:
      - name: download deb package
        uses: actions/download-artifact@v4
        with:
          name: deb-amd64
          path: debs
          run-id: ${{ inputs.deb_run_id }}
          github-token: ${{ github.token }}

      # Mimics the old harness: no dpkg conffile options.
      - name: install with default dpkg options (fuse3 preinstalled)
        run: |
          docker run --rm -v "${PWD}/debs:/debs:ro" ubuntu:22.04 bash -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq && apt-get install -y -qq fuse3 > /dev/null
              apt-get install -y --no-install-recommends /debs/sysbox-ce_*.deb
              echo "apt exit code: $?"
              dpkg -s fuse | grep -i "^status"
              dpkg -s sysbox-ce | grep -i "^status"
          ' || true

      - name: install with --force-confold (fuse3 preinstalled)
        run: |
          docker run --rm -v "${PWD}/debs:/debs:ro" ubuntu:22.04 bash -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq && apt-get install -y -qq fuse3 > /dev/null
              apt-get install -y --no-install-recommends \
                  -o Dpkg::Options::=--force-confold /debs/sysbox-ce_*.deb
              echo "apt exit code: $?"
              dpkg -s fuse | grep -i "^status"
              dpkg -s sysbox-ce | grep -i "^status"
          ' || true

  host-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: download deb package
        uses: actions/download-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: debs
          run-id: ${{ inputs.deb_run_id }}
          github-token: ${{ github.token }}

      - name: package sanity
        run: |
          deb=$(ls debs/sysbox-ce_*.deb)
          dpkg-deb --info "${deb}" | grep -E "Package|Version|Architecture"
          want=${{ matrix.arch }}
          [ "$(dpkg-deb --field "${deb}" Architecture)" = "${want}" ]
          dpkg-deb --contents "${deb}" | grep -E "usr/bin/sysbox-(runc|mgr|fs)$"

      - name: install the deb on the runner host
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
              -o Dpkg::Options::=--force-confold ./debs/sysbox-ce_*.deb
          dpkg -s sysbox-ce | grep -i "^status"

      - name: services, versions and docker runtime
        run: |
          systemctl is-active sysbox sysbox-mgr sysbox-fs
          sysbox-runc --version | head -2
          sysbox-mgr --version | head -1
          sysbox-fs --version | head -1
          docker info 2>/dev/null | grep -E "Runtimes:.*sysbox-runc"

      - name: system container uses a user namespace
        run: |
          docker run --rm --runtime=sysbox-runc ghcr.io/nestybox/alpine:latest sh -c '
              cat /proc/self/uid_map
              host_uid=$(awk "NR==1{print \$2}" /proc/self/uid_map)
              [ "${host_uid}" != "0" ]'

      - name: sysbox-fs virtualizes /proc and /sys
        run: |
          docker run --rm --runtime=sysbox-runc ghcr.io/nestybox/alpine:latest sh -c '
              grep -c sysboxfs /proc/self/mountinfo
              grep -q sysboxfs /proc/self/mountinfo'

      - name: docker-in-docker
        run: |
          id=$(docker run -d --rm --runtime=sysbox-runc ghcr.io/nestybox/alpine-docker-dbg:latest tail -f /dev/null)
          docker exec -d "${id}" sh -c "dockerd > /var/log/dockerd.log 2>&1"
          for i in $(seq 1 40); do docker exec "${id}" docker ps >/dev/null 2>&1 && break; sleep 1; done
          docker exec "${id}" docker run --rm ghcr.io/nestybox/alpine:latest echo inner-container-ok
          docker rm -f "${id}" >/dev/null

  test-deb:
    if: inputs.make_target != ''
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: checkout sysbox
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.SYSBOX_REPO || 'nestybox/sysbox' }}
          ref: ${{ inputs.sysbox_ref }}
          submodules: recursive
          fetch-depth: 0

      - name: free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
              /usr/local/lib/android
          df -h /

      # The test container installs the package from a path relative to the
      # sysbox source tree, which is mounted into the container.
      - name: download deb package
        if: inputs.deb_url == ''
        uses: actions/download-artifact@v4
        with:
          name: deb-amd64
          path: sysbox-pkgr/deb/build/amd64/ubuntu-jammy
          run-id: ${{ inputs.deb_run_id }}
          github-token: ${{ github.token }}

      - name: download deb package from url
        if: inputs.deb_url != ''
        env:
          DEB_URL: ${{ inputs.deb_url }}
        run: |
          mkdir -p sysbox-pkgr/deb/build/amd64/ubuntu-jammy
          curl -fsSL -o "sysbox-pkgr/deb/build/amd64/ubuntu-jammy/$(basename "${DEB_URL}")" "${DEB_URL}"
          ls -l sysbox-pkgr/deb/build/amd64/ubuntu-jammy

      - name: run tests against the deb
        env:
          MAKE_TARGET: ${{ inputs.make_target }}
          TESTPATH: ${{ inputs.testpath }}
          SKIP_SCENARIOS: ${{ inputs.skip_scenarios }}
          SKIP_SUITES: ${{ inputs.skip_suites }}
        run: |
          make "${MAKE_TARGET}" TESTPATH="${TESTPATH}" \
              TEST_SYSBOX_SKIP_SCENARIOS="${SKIP_SCENARIOS}" \
              TEST_SYSBOX_SKIP_SUITES="${SKIP_SUITES}"

      - name: collect logs on failure
        if: failure()
        run: |
          docker ps -a || true
          docker logs sysbox-test 2>&1 | tail -n 1000 || true

      - name: cleanup
        if: always()
        run: |
          make test-cleanup || true
          docker system prune -a -f || true
