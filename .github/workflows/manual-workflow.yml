#
# Probe: run the sysbox installer test flow against the deb built by build.yml.
#
# This replaces the manual-workflow template on this probe branch only, and is
# dispatched through the "Manual Workflow" entry (see the original template).
#

name: Manual Workflow

on:
  workflow_dispatch:
    inputs:
      testpath:
        description: "Test file or directory passed to 'make test-sysbox-installer'"
        required: false
        default: tests/dind/basic.bats
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      sysbox_repo: ${{ vars.SYSBOX_REPO || 'nestybox/sysbox' }}
      ref: master
      build_k8s: false

  test-deb:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: checkout sysbox
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.SYSBOX_REPO || 'nestybox/sysbox' }}
          ref: master
          submodules: recursive
          fetch-depth: 0

      # The test harness needs a lot of disk space.
      - name: free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
              /usr/local/lib/android
          sudo docker system prune -af
          df -h

      # The test container installs the package from a path relative to the
      # sysbox source tree, which is mounted into the container.
      - name: download deb package
        uses: actions/download-artifact@v4
        with:
          name: deb-amd64
          path: sysbox-pkgr/deb/build/amd64/ubuntu-jammy

      - name: show package and host
        run: |
          ls -l sysbox-pkgr/deb/build/amd64/ubuntu-jammy
          cat VERSION
          uname -r
          docker version --format '{{.Server.Version}}'
          df -h /

      - name: run installer tests against the deb
        run: make test-sysbox-installer TESTPATH=${{ inputs.testpath }}

      - name: collect logs on failure
        if: failure()
        run: |
          docker ps -a || true
          docker logs sysbox-test 2>&1 | tail -n 1000 || true

      - name: cleanup
        if: always()
        run: |
          make test-cleanup || true
          docker system prune -a -f || true
