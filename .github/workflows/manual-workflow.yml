#
# Probe: test a previously built sysbox-ce deb without rebuilding it.
#
# This replaces the manual-workflow template on this probe branch only, and is
# dispatched through the "Manual Workflow" entry (see the original template).
#
# * install-check: quick check (no privileged harness) that the deb installs
#   non-interactively in a plain jammy container that already has fuse3.
# * test-deb: runs 'make test-sysbox-installer' against the deb, using the
#   test harness from the given sysbox ref.
#

name: Manual Workflow

on:
  workflow_dispatch:
    inputs:
      deb_run_id:
        description: "Run whose deb-amd64 artifact is tested (build.yml artifact)"
        required: true
        default: "42452842974"
        type: string
      sysbox_ref:
        description: "Ref of the sysbox repo providing the test harness"
        required: false
        default: harness-fix
        type: string
      testpath:
        description: "Test file or directory for 'make test-sysbox-installer' (empty = skip test-deb)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  install-check:
    runs-on: ubuntu-22.04
    steps:
      - name: download deb package
        uses: actions/download-artifact@v4
        with:
          name: deb-amd64
          path: debs
          run-id: ${{ inputs.deb_run_id }}
          github-token: ${{ github.token }}

      # Mimics the old harness: no dpkg conffile options.
      - name: install with default dpkg options (fuse3 preinstalled)
        run: |
          docker run --rm -v "${PWD}/debs:/debs:ro" ubuntu:22.04 bash -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq && apt-get install -y -qq fuse3 > /dev/null
              apt-get install -y --no-install-recommends /debs/sysbox-ce_*.deb
              echo "apt exit code: $?"
              dpkg -s fuse | grep -i "^status"
              dpkg -s sysbox-ce | grep -i "^status"
          ' || true

      - name: install with --force-confold (fuse3 preinstalled)
        run: |
          docker run --rm -v "${PWD}/debs:/debs:ro" ubuntu:22.04 bash -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq && apt-get install -y -qq fuse3 > /dev/null
              apt-get install -y --no-install-recommends \
                  -o Dpkg::Options::=--force-confold /debs/sysbox-ce_*.deb
              echo "apt exit code: $?"
              dpkg -s fuse | grep -i "^status"
              dpkg -s sysbox-ce | grep -i "^status"
          ' || true

  test-deb:
    if: inputs.testpath != ''
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: checkout sysbox
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.SYSBOX_REPO || 'nestybox/sysbox' }}
          ref: ${{ inputs.sysbox_ref }}
          submodules: recursive
          fetch-depth: 0

      - name: free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
              /usr/local/lib/android
          df -h /

      # The test container installs the package from a path relative to the
      # sysbox source tree, which is mounted into the container.
      - name: download deb package
        uses: actions/download-artifact@v4
        with:
          name: deb-amd64
          path: sysbox-pkgr/deb/build/amd64/ubuntu-jammy
          run-id: ${{ inputs.deb_run_id }}
          github-token: ${{ github.token }}

      - name: run installer tests against the deb
        run: make test-sysbox-installer TESTPATH=${{ inputs.testpath }}

      - name: collect logs on failure
        if: failure()
        run: |
          docker ps -a || true
          docker logs sysbox-test 2>&1 | tail -n 1000 || true

      - name: cleanup
        if: always()
        run: |
          make test-cleanup || true
          docker system prune -a -f || true
